<style>
:root{
  --paper:#eef4f4;--panel:#ffffff;--raise:#f2f7f7;--ink:#102e3b;--ink2:#55717e;--ink3:#8099a2;--line:#d6e3e5;--line2:#e7eff0;
  --accent:#e0a66b;--sea:#087e83;--sea-soft:#e2f4f2;--warn:#99591e;--warn-soft:#fff2df;--mapbg:#badadd;--mark:#c2187a;
  --shadow:0 10px 36px rgba(9,48,57,.11),0 1px 2px rgba(7,49,57,.06);
  --font:'DM Sans',system-ui,-apple-system,sans-serif;--headfont:'Manrope','DM Sans',system-ui,sans-serif;color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#091d27;--panel:#102c38;--raise:#183844;--ink:#f2f9f9;--ink2:#b6ccd2;--ink3:#93b0b8;--line:#315260;--line2:#244553;
  --accent:#f4b980;--sea:#6ed9d0;--sea-soft:#193f44;--warn:#ffce8e;--warn-soft:#3d3429;--mapbg:#123841;--shadow:0 12px 35px rgba(0,0,0,.3);color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.006em;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--sea)}
:focus-visible{outline:2px solid #efae6e;outline-offset:3px}
.app{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
svg.i{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--ink2);flex:none}
.ib svg{width:16px;height:16px}

/* ---- masthead ---- */
.bar{position:relative;z-index:1000;display:flex;align-items:center;min-height:87px;padding:15px clamp(17px,2vw,34px);gap:clamp(12px,1.8vw,30px);
  background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 5px 22px rgba(10,49,60,.035)}
.bar:before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#073c4d 0%,#0aa39f 54%,#eac28e 100%)}
.brand{display:flex;gap:12px;color:var(--ink);align-items:center;text-decoration:none;flex:none}
.brand svg{box-sizing:content-box;padding:11px;width:32px;height:32px;background:#0c3b49;border-radius:18px;color:#a3ebe1;stroke-width:2.35;box-shadow:0 5px 12px rgba(4,58,65,.17)}
.brand-lockup{display:flex;flex-direction:column;gap:3px;white-space:nowrap}
.brand-name{font:800 27px/1 var(--headfont);letter-spacing:-.075em}
.brand-stop{color:#14aaa4}
.brand-kicker{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--ink3)}
.bar-pick{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.runbox{display:flex;align-items:center;gap:10px;height:43px;padding:0 14px;background:var(--raise);border:1px solid var(--line);border-radius:11px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.runbox small{font-weight:500;color:var(--ink2);letter-spacing:0}
.run{max-width:370px;font-size:11.5px;color:var(--ink2);line-height:1.36}
.bar-end{display:flex;align-items:center;gap:9px;flex:none}
.seg{display:flex;gap:2px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--raise)}
.seg button{padding:7px 12px;border-radius:7px;color:var(--ink2);font-size:12px;font-weight:600}
.seg button[aria-pressed="true"]{background:#0a4a56;color:#fff;box-shadow:0 2px 6px rgba(9,59,69,.14)}
.bar-end .ib{width:39px;height:39px;border:1px solid var(--line);border-radius:10px}
.bar-end .ib:hover{color:var(--sea);background:var(--sea-soft)}
.tag{border-radius:9px;padding:8px 10px;color:var(--warn);background:var(--warn-soft);border:1px solid rgba(194,141,81,.2);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}

/* ---- stage ---- */
.stage{display:grid;grid-template-columns:minmax(0,1fr) clamp(352px,28.5vw,422px);gap:12px;padding:12px 14px 10px;min-height:0}

}

<div class="app" id="app">

/* ---------- helpers ---------- */

/* ---------- colour ramps: cmocean speed (wind) and rain ---------- */

  pm:{name:'PM2.5, fine particles',short:'Particulates',unit:'µg/m³ near the surface',max:100,
    ramp:['#30123b','#4146ac','#4776ee','#3aa3fc','#1bd0d5','#25eca7','#61fc6c','#a4fc3c','#d2e935','#f4c73a','#fe9b2d','#f36315','#da3907','#b21a01','#7a0403'],  // Turbo

  wind:{name:'Wind speed',short:'Wind speed',unit:'kt at 10 m',max:45,
    ramp:['#fffdcd','#f1e4a0','#e1cd73','#c9ba45','#aaac20','#879f08','#5f920c','#39831c','#187328','#0b5f2d','#144b2a','#193721','#172313'],   // cmocean.speed

  rain:{name:'Rain',short:'Rain',unit:`mm per ${ivl} h`,max:30,

/* colour field */
let layer='wind',fieldLayer=null,alpha=0.8;const cache={};

    for(let px=0;px<FW;px++){const lon=lon0-dLon/2+(px+0.5)/S*dLon,o=(py*FW+px)*4;
      if(kind==='wind'){const u=sample(k,'u',lat,lon),v=sample(k,'v',lat,lon);if(u==null)continue;const c=windRGB(Math.hypot(u,v));D[o]=c[0];D[o+1]=c[1];D[o+2]=c[2];D[o+3]=255;}

/* moving streaks — smooth: every animation frame, time-based steps, few long-lived
   particles that fade in and out instead of popping */
let motion='streaks';
const Streaks=L.Layer.extend({
  onAdd(m){this._c=L.DomUtil.create('canvas','',m.getPane('parts'));this._x=this._c.getContext('2d');
    m.on('movestart zoomstart',this._stop,this);m.on('moveend zoomend resize',this._reset,this);this._reset();},
  onRemove(m){this._stop();L.DomUtil.remove(this._c);m.off('movestart zoomstart',this._stop,this);m.off('moveend zoomend resize',this._reset,this);},
  _stop(){cancelAnimationFrame(this._raf);this._raf=null;if(this._x)this._x.clearRect(0,0,this._c.width,this._c.height);},
  _reset(){

    this._dpr=dpr;this._c.width=sz.x*dpr;this._c.height=sz.y*dpr;this._c.style.width=sz.x+'px';this._c.style.height=sz.y+'px';
    this._W=sz.x;this._H=sz.y;L.DomUtil.setPosition(this._c,m.containerPointToLayerPoint([0,0]));
    const vb=m.getBounds(),b=L.latLngBounds(bounds),s=Math.max(vb.getSouth(),b.getSouth()),n=Math.min(vb.getNorth(),b.getNorth()),
          w=Math.max(vb.getWest(),b.getWest()),e=Math.min(vb.getEast(),b.getEast());
    if(!(s<n&&w<e))return;
    // work in screen pixels: the visible part of the forecast box
    const p1=m.latLngToContainerPoint([n,w]),p2=m.latLngToContainerPoint([s,e]);
    this._box=[Math.max(0,p1.x),Math.max(0,p1.y),Math.min(sz.x,p2.x),Math.min(sz.y,p2.y)];
    const area=(this._box[2]-this._box[0])*(this._box[3]-this._box[1]);
    const N=Math.round(Math.min(900,Math.max(80,area/1600)));           // ~1 streak per 40x40 px
    this._lat=new Float64Array(sz.y+1);for(let y=0;y<=sz.y;y++)this._lat[y]=m.containerPointToLatLng([0,y]).lat;
    const tl=m.containerPointToLatLng([0,0]);this._lon0=tl.lng;this._dlon=(m.containerPointToLatLng([sz.x,0]).lng-tl.lng)/sz.x;

  },
  _spawn(anyAge){const[x0,y0,x1,y1]=this._box,life=3+Math.random()*3;
    return{x:x0+Math.random()*(x1-x0),y:y0+Math.random()*(y1-y0),age:anyAge?Math.random()*life:0,life};},
  _loop(){this._raf=requestAnimationFrame(t=>{const dt=Math.max(0,Math.min(0.05,(t-this._last)/1000));this._last=t;this._step(dt);this._loop();});},
  _step(dt){

    x.globalCompositeOperation='destination-in';x.fillStyle=`rgba(0,0,0,${Math.pow(0.07,dt).toFixed(3)})`;x.fillRect(0,0,this._W,this._H);
    x.globalCompositeOperation='source-over';

    x.lineWidth=1.5;x.lineCap='round';

      const p=this._p[q];p.age+=dt;
      if(p.age>p.life){this._p[q]=this._spawn(false);continue;}
      const la=this._lat[Math.max(0,Math.min(this._H,p.y|0))],lo=this._lon0+p.x*this._dlon,u=sample(k,'u',la,lo),v=sample(k,'v',la,lo);
      if(u==null){this._p[q]=this._spawn(false);continue;}

      const f=Math.min(1,p.age/0.6,(p.life-p.age)/0.8);                 // fade in 0.6 s, out 0.8 s
      groups[Math.max(0,Math.min(3,Math.floor(f*4)))].push(p.x,p.y,nx,ny);
      p.x=nx;p.y=ny;
      const[x0,y0,x1,y1]=this._box;if(nx<x0||ny<y0||nx>x1||ny>y1)p.age=p.life+1;
    }
    groups.forEach((g,gi)=>{if(!g.length)return;x.strokeStyle=`rgba(${col},${(0.18+gi*0.2).toFixed(2)})`;x.beginPath();

  }

const streaks=new Streaks();
const arrowLayer=L.layerGroup();

  for(let j=stride>>1;j<ny;j+=stride)for(let i=stride>>1;i<nx;i+=stride){const la=G.lats[j],lo=G.lons[i];if(!b.contains([la,lo]))continue;
    const u=val(f,'u',j,i),v=val(f,'v',j,i);if(u==null)continue;const to=(Math.atan2(u,v)*180/Math.PI+360)%360,len=Math.min(11,4+Math.hypot(u,v)*0.6);

    L.marker([la,lo],{pane:'labels',interactive:false,keyboard:false,icon:L.divIcon({className:'wind-ic',iconSize:[28,28],iconAnchor:[14,14],
      html:`<svg width="28" height="28" viewBox="-14 -14 28 28" style="transform:rotate(${to}deg)"><path d="${d}" stroke="${halo}" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${ink}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`})}).addTo(arrowLayer);}
}
function setMotion(m){motion=m;

/* Main population centres are always labelled. They sit within 5 km of each
   other, so each label goes on its own side. Then settlements from
   OpenStreetMap (city > town > village), then other named islands by size. */
const PINNED=[{name:'Malé',lat:4.1755,lon:73.5093,anchor:'left'},{name:'Hulhulé',lat:4.1918,lon:73.5291,anchor:'right'},{name:'Hulhumalé',lat:4.2140,lon:73.5410,anchor:'top'}];
const norm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f'\u2019`]/g,'').toLowerCase().replace(/\s*(city|island)$/,'').trim();
const labelCands=(()=>{
  const out=PINNED.map(p=>({...p,rank:0,area:99,dot:true})),seen=new Set(PINNED.map(p=>norm(p.name)));
  ((ISL&&ISL.places)||[]).forEach(p=>{const key=norm(p.name);if(seen.has(key))return;seen.add(key);out.push({name:p.name,lat:p.lat,lon:p.lon,rank:p.rank,area:0,dot:true,anchor:'right'});});
  islIndex.forEach(it=>{const key=norm(it.name);if(seen.has(key))return;seen.add(key);out.push({...it,rank:5,anchor:'center'});});
  return out.sort((a,b)=>a.rank-b.rank||b.area-a.area);
})();
function labelBox(p,c){const w=c.name.length*(c.rank<=1?8:7)+6,h=16;
  if(c.anchor==='left')return[p.x-w-8,p.y-h/2,p.x-8,p.y+h/2];
  if(c.anchor==='right')return[p.x+8,p.y-h/2,p.x+8+w,p.y+h/2];
  if(c.anchor==='top')return[p.x-w/2,p.y-h-8,p.x+w/2,p.y-8];
  return[p.x-w/2,p.y-h/2,p.x+w/2,p.y+h/2];}
function drawLabels(){
  labels.clearLayers();if(!showIsl)return;const z=map.getZoom();
  const maxRank=z<7.5?2:z<8.5?3:z<9.5?4:5,minA=z>=12?0:z>=11?.03:z>=10?.15:.4,cap=z<9?45:260,b=map.getBounds().pad(.02),boxes=[];let n=0;
  for(const c of labelCands){
    if(c.rank>maxRank||(c.rank===5&&c.area<minA)||!b.contains([c.lat,c.lon]))continue;
    const p=map.latLngToContainerPoint([c.lat,c.lon]),bx=labelBox(p,c);
    if(c.rank>0&&boxes.some(o=>bx[0]<o[2]+4&&bx[2]+4>o[0]&&bx[1]<o[3]+2&&bx[3]+2>o[1]))continue;
    boxes.push(bx);
    L.marker([c.lat,c.lon],{pane:'labels',interactive:false,keyboard:false,icon:L.divIcon({iconSize:[0,0],
      className:`isl-lab a-${c.anchor}${c.rank<=1?' cap':c.rank<=3?' big':''}`,html:`${c.dot?'<i></i>':''}<span>${esc(c.name)}</span>`})}).addTo(labels);
    if(++n>=cap)break;}
}
const nearestIsland=(la,lo)=>{let b=null,bd=1e9;for(const it of islIndex){const d=km(la,lo,it.lat,it.lon);if(d<bd){bd=d;b=it;}}return b?{...b,dist:bd}:null;};

document.querySelectorAll('#units button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#units button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));unit=b.dataset.u;renderPoint();});

let S2=null;
function series(){const{j,i}=sel,o={precip:[],speed:[],dir:[],gust:[],pm25:[],pm10:[],aod:[],aqi:[],a25:[],a10:[],ao3:[]};
  if(hasAQI)T.forEach((t,q)=>{const pv=(key)=>{const pj=nIdx(P.lats,sel.lat),pi=nIdx(P.lons,sel.lon);return pval(P.fields[q],key,pj,pi);};
    o.aqi.push(pv('aqi'));o.a25.push(pv('aqi_pm25'));o.a10.push(pv('aqi_pm10'));o.ao3.push(pv('aqi_o3'));});
  T.forEach((t,q)=>{o.pm25.push(samplePM(q,'pm2_5',sel.lat,sel.lon));o.pm10.push(samplePM(q,'pm10',sel.lat,sel.lon));o.aod.push(samplePM(q,'aod',sel.lat,sel.lon));});
  F.fields.forEach(f=>{const u=val(f,'u',j,i),v=val(f,'v',j,i);o.precip.push(val(f,'precip',j,i));o.speed.push(u==null?null:Math.hypot(u,v));
    o.dir.push(u==null?null:(Math.atan2(-u,-v)*180/Math.PI+360)%360);o.gust.push(f.gust?val(f,'gust',j,i):null);});return o;}
function renderPoint(){
  selMk.setLatLng([sel.lat,sel.lon]); S2=series();
  const ni=ISL?nearestIsland(sel.lat,sel.lon):null;let name,sub=`${sel.lat.toFixed(3)}°N, ${sel.lon.toFixed(3)}°E · 9 km grid cell ${G.lats[sel.j].toFixed(1)}°, ${G.lons[sel.i].toFixed(1)}°E`;
  if(sel.name)name=sel.name;else if(ni&&ni.dist<3)name=ni.name;else if(ni){name='Open water';sub=`${ni.dist.toFixed(0)} km from ${ni.name} · `+sub;}else name=`${sel.lat.toFixed(2)}°, ${sel.lon.toFixed(2)}°E`;
  $('#ptName').textContent=name;$('#ptLoc').textContent=sub;
  drawSpark(); renderNow(); drawChart(); drawTable();
}
/* forecast window length: from the data (default 48 h) */
const HRS=M.hours||Math.max(ivl,Math.round((new Date(T[T.length-1].replace('Z',':00Z'))-new Date(T[0].replace('Z',':00Z')))/36e5));
$('#subHead').textContent=`Next ${HRS} hours`;
function renderNow(){
  const s=S2,U=UNITS[unit].l,sp=s.speed[k],d=s.dir[k],g=s.gust[k],r=s.precip[k];
  $('#heroBig').innerHTML=`${fmt(cv(sp),0)}<small>${U}</small>`;
  $('#heroDir').innerHTML=d==null?'':`From ${compass(d)} <span>${Math.round(d)}°</span>`;
  $('#heroCap').textContent=`Wind at ${lbl(T[k])}${g!=null?` · gusts ${fmt(cv(g),0)} ${U}`:''} · rain ${fmt(r)} mm in ${ivl} h${s.pm25[k]!=null?` · PM2.5 ${fmt(s.pm25[k],0)} µg/m³`:''}`;
  const to=d==null?0:(d+180)%360;
  $('#rose').innerHTML=`<circle class="ring" r="38"/><circle class="ring" r="26" opacity=".5"/><text y="-41">N</text><text x="45" y="3">E</text><text y="48">S</text><text x="-45" y="3">W</text>
    <g transform="rotate(${to})"><path class="arrow" d="M0,-26 L7,-10 L2,-12 L2,24 L-2,24 L-2,-12 L-7,-10 Z"/></g>`;
  const n=Math.min(T.length,Math.round(HRS/ivl)),pr=s.precip.slice(0,n),sw=s.speed.slice(0,n),gu=s.gust.slice(0,n).filter(x=>x!=null);
  const tot=pr.reduce((a,b)=>a+(b||0),0),pmax=Math.max(...pr.map(x=>x||0)),pk=pr.indexOf(pmax),wmax=Math.max(...sw.map(x=>x||0)),wk=sw.indexOf(wmax);
  const wet=pr.filter(x=>x>=0.1).length*ivl;
  let aqiCard='';
  if(hasAQI&&s.aqi[k]!=null){const v=s.aqi[k],c=aqiCat(v),subs=[['PM2.5',s.a25[k]],['PM10',s.a10[k]],['ozone',s.ao3[k]]].filter(x=>x[1]!=null).sort((a,b)=>b[1]-a[1]);
    const nn=Math.min(T.length,Math.round(HRS/ivl)),av=s.aqi.slice(0,nn),worst=Math.max(...av.filter(x=>x!=null)),wk2=av.indexOf(worst);
    aqiCard=`<div class="wide aqicard" style="--aqc:${c[2]}"><dt>Air quality now · US AQI${subs.length?` · mainly ${subs[0][0]}`:''}</dt>
      <dd>${Math.round(v)}<small>${c[1]}</small></dd><p>Worst in the next ${HRS} h: <b>${Math.round(worst)}</b> ${aqiCat(worst)[1].toLowerCase()} · ${lbl(T[wk2])}</p></div>`;}
  $('#facts').innerHTML=aqiCard+[
    [`Rain, next ${HRS} h`,`${fmt(tot)}<small>mm</small>`],
    ['Wettest 3 hours',pmax>=0.1?`${fmt(pmax)}<small>mm · ${lbl(T[pk])}</small>`:`dry`],
    ['Strongest wind',`${fmt(cv(wmax),0)}<small>${U} · ${lbl(T[wk])}</small>`],
    ['Strongest gust',gu.length?`${fmt(cv(Math.max(...gu)),0)}<small>${U}</small>`:'–'],
    ...(P?(()=>{const p=s.pm25.slice(0,n),pv=p.filter(x=>x!=null),pmx=pv.length?Math.max(...pv):null,pk2=p.indexOf(pmx),now=s.pm25[k];
      return [[`Haze now · PM2.5`,now==null?'–':`<span class="pmdot" style="background:rgb(${pmRGB(now)})"></span>${fmt(now,0)}<small>µg/m³ · ${pmBand(now)}</small>`],
              [`Haziest · next ${HRS} h`,pmx==null?'–':`${fmt(pmx,0)}<small>µg/m³ · ${lbl(T[pk2])}</small>`]];})():[])
  ].map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('');
  $('#subNote').textContent=`${wet} h with rain`;
  document.querySelectorAll('#tbl tr[data-k]').forEach(r=>r.classList.toggle('on',+r.dataset.k===k));
  markChart();
}
function drawChart(){
  const darkChart=theme==='dark', tone=(dark,light)=>darkChart?dark:light;
  const s=S2,U=UNITS[unit].l,xE=T.map(t=>local(t).toISOString().slice(0,16)),xM=T.map(t=>new Date(local(t).getTime()-ivl*1800e3).toISOString().slice(0,16));
  let c=0;const cum=s.precip.map(p=>c+=(p||0)),sp=s.speed.map(cv),gu=s.gust.map(cv);
  const tr=[
    {x:xM,y:s.precip,type:'bar',name:'Rain',marker:{color:tone('#8fb8ff','#316bb0'),opacity:.85},width:ivl*3600e3*.72,yaxis:'y',hovertemplate:'%{y:.1f} mm<extra>Rain</extra>'},
    {x:xE,y:cum,type:'scatter',mode:'lines',name:'Total',line:{color:tone('#a5c5d0','#65737c'),width:1.5,dash:'dot'},yaxis:'y2',hovertemplate:'%{y:.1f} mm<extra>Total</extra>'},
    {x:xE,y:sp,type:'scatter',mode:'lines+markers',name:'Wind',line:{color:tone('#7ce8d7','#187a74'),width:2.7,shape:'spline'},fill:'tozeroy',fillcolor:tone('rgba(109,217,208,.13)','rgba(24,122,116,.10)'),
      marker:{symbol:'arrow',size:12,angle:s.dir.map(d=>(d+180)%360),color:tone('#c9f5f0','#187a74'),line:{width:0}},yaxis:'y3',
      customdata:s.dir.map(d=>compass(d)),hovertemplate:'%{y:.0f} '+U+' from %{customdata}<extra>Wind</extra>'}];
  if(P)tr.push({x:xE,y:s.pm25,type:'scatter',mode:'lines',name:'PM2.5',line:{color:tone('#fe9b2d','#a94e19'),width:2.4,shape:'spline'},yaxis:'y4',hovertemplate:'%{y:.0f} µg/m³<extra>PM2.5</extra>'},
               {x:xE,y:s.pm10,type:'scatter',mode:'lines',name:'PM10',line:{color:tone('#f4c73a','#8a6d11'),width:1.4,dash:'dot',shape:'spline'},yaxis:'y4',hovertemplate:'%{y:.0f} µg/m³<extra>PM10</extra>'});
  if(M.has_gust)tr.push({x:xE,y:gu,type:'scatter',mode:'lines',name:'Gust',line:{color:tone('#e8bc82','#9b662b'),width:2,dash:'dash',shape:'spline'},yaxis:'y3',hovertemplate:'%{y:.0f} '+U+'<extra>Gust</extra>'});
  const g=tone('rgba(193,236,233,.12)','rgba(36,42,44,.12)'),mr=Math.max(2,...s.precip.map(x=>x||0))*1.2,mw=Math.max(5,...sp.filter(x=>x!=null),...gu.filter(x=>x!=null))*1.18;
  Plotly.react('chart',tr,{margin:{l:34,r:30,t:4,b:26},font:{family:'Arial, Helvetica, sans-serif',size:10.5,color:tone('#accdd2','#4b5559')},paper_bgcolor:'rgba(0,0,0,0)',plot_bgcolor:'rgba(0,0,0,0)',showlegend:false,
    xaxis:{type:'date',gridcolor:g,tickformat:'%a %Hh',anchor:P?'y4':'y3',linecolor:g,nticks:$('#chart').clientWidth<360?4:6},
    yaxis:{domain:P?[.72,1]:[.58,1],range:[0,mr],gridcolor:g,zeroline:false,title:{text:'mm',standoff:2,font:{size:10}}},
    yaxis2:{overlaying:'y',side:'right',showgrid:false,rangemode:'tozero',tickfont:{size:9.5}},
    yaxis3:{domain:P?[.37,.64]:[0,.5],range:[0,mw],gridcolor:g,zeroline:false,title:{text:U,standoff:2,font:{size:10}}},
    yaxis4:{domain:[0,.29],rangemode:'tozero',gridcolor:g,zeroline:false,title:{text:'µg/m³',standoff:2,font:{size:10}},visible:!!P},
    bargap:.1,hovermode:'x unified',hoverlabel:{bgcolor:'#082f40',bordercolor:'#2f6372',font:{color:'#fff',family:'Arial, Helvetica, sans-serif'}},shapes:[]},{displayModeBar:false,responsive:true});
  const el=$('#chart');el.removeAllListeners&&el.removeAllListeners('plotly_click');
  el.on('plotly_click',ev=>{const x=String(ev.points[0].x).replace(' ','T').slice(0,16);let q=xE.indexOf(x);if(q<0)q=xM.indexOf(x);if(q>=0)setTime(q);});
  $('#key').innerHTML=`<span><i></i>Wind</span>${M.has_gust?'<span><i class="k2"></i>Gust</span>':''}<span><i class="k3"></i>Rain per ${ivl} h</span><span><i class="k4"></i>Running total</span>${P?'<span><i class="k5"></i>PM2.5</span><span><i class="k6"></i>PM10</span>':''}`;
  $('#note').textContent='Model estimate for a ~9 km square, not a measurement at one spot. Island effects and showers smaller than that are not resolved.'+(P?' PM2.5/PM10 come from the coarser CAMS model (~45 km); the health bands (US EPA) are defined for 24-hour averages, so treat 3-hourly values as a guide.':'');
  markChart();
}
function markChart(){const el=$('#chart');if(!el.layout)return;const x=local(T[k]).toISOString().slice(0,16);
  Plotly.relayout(el,{shapes:[{type:'line',xref:'x',yref:'paper',x0:x,x1:x,y0:0,y1:1,line:{color:'#f6b180',width:1.6}}]});}
function drawTable(){
  const s=S2,U=UNITS[unit].l;
  let h=`<thead><tr><th>Time</th><th>Rain mm</th><th>Wind ${U}</th><th>From</th>${M.has_gust?`<th>Gust</th>`:''}${P?'<th>PM2.5</th>':''}${hasAQI?'<th>AQI</th>':''}</tr></thead><tbody>`;
  T.forEach((t,q)=>{const d=s.dir[q],r=s.precip[q];
    h+=`<tr data-k="${q}" class="${q===k?'on':''}"><td>${lbl(t)}</td><td>${r!=null&&r>=0.1?`<i class="sw" style="background:rgb(${rainRGB(r)})"></i>`:''}${fmt(r)}</td>
      <td><i class="sw" style="background:rgb(${windRGB(s.speed[q]||0)})"></i>${fmt(cv(s.speed[q]),0)}</td>
      <td>${d==null?'–':`<span class="da" style="display:inline-block;transform:rotate(${(d+180)%360}deg)">↑</span> ${compass(d)}`}</td>${M.has_gust?`<td>${fmt(cv(s.gust[q]),0)}</td>`:''}${P?`<td>${s.pm25[q]==null?'–':`<i class="sw" style="background:rgb(${pmRGB(s.pm25[q])})"></i>${fmt(s.pm25[q],0)}`}</td>`:''}${hasAQI?`<td>${aqiPill(s.aqi[q])}</td>`:''}</tr>`;});
  $('#tbl').innerHTML=h+'</tbody>';
  document.querySelectorAll('#tbl tr[data-k]').forEach(r=>r.onclick=()=>setTime(+r.dataset.k));
}

/* ---------- timeline ---------- */
let k=0,timer=null;const N=T.length;
const xPct=q=>N>1?(q/(N-1))*100:0;
function drawTicks(){let h='';T.forEach((t,q)=>{const d=local(t),hr=d.getUTCHours(),day=q===0||local(T[q-1]).getUTCDate()!==d.getUTCDate();
  h+=`<i class="${day||hr%6===0?'maj':''}" style="left:${xPct(q)}%"></i>`;
  if(day)h+=`<b class="day" style="left:${Math.min(Math.max(xPct(q),4),96)}%">${DOW[d.getUTCDay()]} ${d.getUTCDate()}</b>`;
  else if(hr%6<ivl&&xPct(q)>8&&xPct(q)<95)h+=`<b style="left:${xPct(q)}%">${pad(hr)}h</b>`;});$('#ticks').innerHTML=h;
  const now=Date.now(),t0=new Date(T[0].replace('Z',':00Z')).getTime(),t1=new Date(T[N-1].replace('Z',':00Z')).getTime();
  if(now>=t0&&now<=t1){$('#nowMark').hidden=false;$('#nowMark').style.left=((now-t0)/(t1-t0)*100)+'%';}}
function drawSpark(){const sp=S2.speed.map(x=>x||0),mx=Math.max(1,...sp),W=1000,H=100;
  const pts=sp.map((v,q)=>`${xPct(q)*W/100},${H-v/mx*H*.9}`).join(' L');$('#spark').setAttribute('viewBox',`0 0 ${W} ${H}`);
  $('#spark').innerHTML=`<path d="M0,${H} L${pts} L${W},${H} Z"/>`;}
function setTime(n){k=Math.max(0,Math.min(N-1,n));$('#thumb').style.left=xPct(k)+'%';const d=local(T[k]);
  $('#tClock').textContent=`${pad(d.getUTCHours())}:00`;$('#tDay').textContent=`${DOWL[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;
  $('#track').setAttribute('aria-valuenow',k);$('#track').setAttribute('aria-valuetext',lbl(T[k])+' Maldives time');drawField();drawArrows();if(S2)renderNow();}
const track=$('#track');
function fromX(cx){const r=track.getBoundingClientRect();setTime(Math.round((cx-r.left)/r.width*(N-1)));}
track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax',String(N-1));
track.addEventListener('pointerdown',e=>{if(e.button!==0||!e.isPrimary)return;track.setPointerCapture(e.pointerId);fromX(e.clientX);});
track.addEventListener('pointermove',e=>{if(track.hasPointerCapture(e.pointerId))fromX(e.clientX);});
track.addEventListener('keydown',e=>{const n={ArrowRight:k+1,ArrowLeft:k-1,ArrowUp:k+1,ArrowDown:k-1,Home:0,End:N-1}[e.key];if(n!==undefined){e.preventDefault();setTime(n);}});
$('#stepBack').onclick=()=>setTime(k-1);$('#stepFwd').onclick=()=>setTime(k+1);
$('#playBtn').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('#app').classList.remove('playing');return;}
  $('#app').classList.add('playing');timer=setInterval(()=>setTime((k+1)%N),1100);};
function warm(q=0){if(q>=N)return;(window.requestIdleCallback||setTimeout)(()=>{fieldImage(layer,q);warm(q+1);});}

/* Re-measure the map when its layout changes at phone/tablet breakpoints. */
if(typeof ResizeObserver==='function'){
  let lastMapSize='';
  new ResizeObserver(()=>{const el=$('#map'),size=el.clientWidth+'x'+el.clientHeight;if(size===lastMapSize)return;lastMapSize=size;map.invalidateSize({pan:false,debounceMoveend:true});}).observe($('#map'));
}
/* ---------- start ---------- */
const nowMs=Date.now();for(let q=0;q<N;q++)if(new Date(T[q].replace('Z',':00Z')).getTime()>=nowMs-ivl*1800e3){k=q;break;}
if(P){document.body.classList.add('has-pm');map.attributionControl.addAttribution('Particulates: CAMS/Copernicus via Open-Meteo');}
drawCountries();applyTheme();drawLayers();drawLegend();setMotion('streaks');islandMode();drawTicks();renderPoint();setTime(k);drawLabels();warm();
})();
</script>
